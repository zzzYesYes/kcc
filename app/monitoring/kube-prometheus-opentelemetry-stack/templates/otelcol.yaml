apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelcol-prometheus-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otelcol-prometheus-role
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
# 1. Prometheus Operator CRD 权限
- apiGroups: ["monitoring.coreos.com"]
  resources:
  - servicemonitors
  - podmonitors
  - probes
  - scrapeconfigs
  verbs: ["*"]
# 2. K8s 核心资源权限（支持 Service/Endpoint 发现）
- apiGroups: [""]
  resources:
  - namespaces
  - nodes
  - nodes/metrics
  - nodes/proxy
  - services
  - endpoints
  - pods
  - configmaps
  - secrets
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - daemonsets
  - statefulsets
  - deployments
  verbs: ["get", "list", "watch"]
# 3. K8s 新版本网络与 EndpointSlice 权限
- apiGroups: ["discovery.k8s.io"]
  resources:
  - endpointslices
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
# 4. 抓取非资源 URL（如 node/kubelet 的 /metrics）权限
- nonResourceURLs:
  - "/metrics"
  - "/metrics/cadvisor"
  - "/api"
  - "/api/*"
  - "/apis"
  - "/apis/*"
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otelcol-prometheus-binding
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
- kind: ServiceAccount
  name: otelcol-prometheus-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: otelcol-prometheus-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otelcol-prometheus
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  mode: statefulset
  serviceAccount: otelcol-prometheus-sa

  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.156.0

  targetAllocator:
    enabled: true
    serviceAccount: otelcol-prometheus-sa
    prometheusCR:
      enabled: true
      serviceMonitorSelector:
        matchLabels:
          release: {{ .Release.Name }}
        matchExpressions:
          - key: app
            operator: NotIn
            values:
              - "kube-prometheus-stack-kube-etcd"
              - "kube-prometheus-stack-kube-controller-manager"
              - "kube-prometheus-stack-kube-scheduler"
              - "kube-prometheus-stack-kube-proxy"
      podMonitorSelector:
        matchLabels:
          release: {{ .Release.Name }}

  config:
    receivers:
      prometheus:
        config:
          scrape_configs: []
          global:
            scrape_interval: 15s
            scrape_timeout: 10s
        target_allocator:
          endpoint: http://otelcol-prometheus-targetallocator:80
          interval: 30s

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        send_batch_size: 8192

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        add_metric_suffixes: false
        send_timestamps: true
        without_scope_info: true

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
