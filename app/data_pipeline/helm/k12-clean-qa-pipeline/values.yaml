    - name: qa-14-15
      physicalDevices: [14, 15]
      endpoints:
        - id: qwen-a
          devices: "14"
          port: 8000
          cpuSet: 0-27
        - id: qwen-b
          devices: "15"
          port: 8001
          cpuSet: 28-55
