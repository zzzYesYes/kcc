      requests:
        cpu: "8"
        memory: 32Gi
      limits:
        cpu: "8"
        memory: 32Gi
  sharedMemorySize: 64Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  service:
    enabled: true
    type: ClusterIP
  runtime:
    maxModelLen: 32768
    maxNumSeqs: 8
    maxNumBatchedTokens: 4096
    gpuMemoryUtilization: 0.85
    enableExpertParallel: true
    enablePrefixCaching: false
    compilationConfig: '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
    additionalConfig: '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'

stage1:
  version: stage1-v1.0.2
  count: 10
  resume: true
  cpuWorkers: 16
  maxDocumentInflight: 8
  selectionManifestKey: manifests/stage1_test_10.json
  automatedValidation: true
  dryRun: false
  outputPrefix: stage1/smoke/stage1-v1.0.2

stage2:
  version: stage2-v1.1.0
  promptVersion: k12-qa-zh-v1.2
  count: 10
  resume: true
  outputPrefix: stage2/smoke/stage2-v1.1.0-k12-qa-zh-v1.2
  documentInflight: 3
  blockInflight: 8
  generationMaxInflight: 8
  judgeMaxInflight: 4
  httpPoolSize: 16
  microbatchSize: 2
  judgeBatchSize: 8
  mergeMaxBlocks: 8
  mergeMaxChars: 3200
  chapterMaxUnits: 12
  documentMaxUnits: 48
  requireJudgeForVerified: true
  maxBlocksPerDocument: 0
  benchmark: false
  automatedValidation: true
  dryRun: false

collectors:
  cleanMarkdown:
    outputPrefix: stage1/clean-md-collection-v1
  trainingJsonl:
    outputPrefix: stage2/training-jsonl-collection-v1
    requireVerified: true
    requireJudgeAccept: true
