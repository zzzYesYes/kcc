global:
  namespaceOverride: ""
  imagePullSecrets: []
  labels: {}

externalS3:
  endpoint: http://minio.example.internal:9000
  region: us-east-1
  pathStyle: true
  credentialsSecret:
    name: k12-pipeline-s3
    accessKeyKey: access-key
    secretKeyKey: secret-key
  buckets:
    raw: k12-textbook-raw
    mineru: k12-mineru-output
    cleaned: k12-cleaned-corpus
  prefixes:
    raw: source=tchMaterial-parser
    mineru: full-output/mineru34-hybrid-a3-full-20260722T104600Z
    stage1: stage1/full/stage1-v1.0.2
    stage2: stage2/full/stage2-v1.1.0-8npu
    cleanCollection: stage1/clean-md-collection-v1
    trainingCollection: stage2/training-jsonl-collection-v1

proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: >-
    127.0.0.1,localhost,.svc,.svc.cluster.local,kubernetes.default.svc

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

dagster:
  enabled: true
  replicaCount: 1
  image:
    repository: data-pipeline
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    nodePort: 30080
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 32Gi
  nodeSelector:
    kubernetes.io/arch: amd64
  affinity: {}
  tolerations: []
  workingDir: /opt/data-pipeline/src
  dagsterHome: /opt/dagster/dagster_home
  storage:
    type: emptyDir
    existingClaim: ""
    hostPath: ""
    sizeLimit: ""
  extraEnv: []

ray:
  enabled: true
  version: "2.48.0"
  clusterName: k12-clean-qa
  enableInTreeAutoscaling: true
  idleTimeoutSeconds: 60
  head:
    image:
      repository: 110.120.0.3:8889/mineru/ray-data
      tag: py3.11.13-ray2.48.0-daft0.7.19-dagster1.13.13-s3-compress-20260716
      pullPolicy: IfNotPresent
    rayStartParams:
      num-cpus: "0"
      dashboard-host: 0.0.0.0
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "8"
        memory: 32Gi
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity: {}
    tolerations: []
    service:
      dashboardPort: 8265
      clientPort: 10001
  cpuWorker:
    enabled: true
    groupName: cpu-data-worker
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "16"
      resources: '{"CPU_DATA": 1}'
    resources:
      requests:
        cpu: "16"
        memory: 64Gi
      limits:
        cpu: "18"
        memory: 72Gi
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity: {}
    tolerations: []

ascend:
  resourceName: huawei.com/Ascend910
  nodeSelector:
    kubernetes.io/arch: arm64
    kubernetes.io/hostname: a3-server-00
  tolerations: []
  securityContext:
    privileged: true
  hostMounts:
    enabled: true
    driverPath: /usr/local/Ascend/driver
    dcmiPath: /usr/local/dcmi
    npuSmiPath: /usr/local/bin/npu-smi

models:
  qwen:
    volumeType: hostPath
    hostPath: /home/admin/models/Qwen3.6-35B-A3B-w8a8
    existingClaim: ""
    subPath: ""
    mountPath: /models/Qwen3.6-35B-A3B-w8a8

mineru:
  enabled: true
  standaloneEnabled: true
  rayWorkerGroupEnabled: true
  replicas: 0
  minReplicas: 0
  maxReplicas: 1
  groupName: mineru-npu-worker
  image:
    repository: 110.120.0.3:8889/mineru/mineru-vllm-a3
    tag: official-v0.11.0-20260715-ray248-lake-20260716
    pullPolicy: IfNotPresent
  physicalDevices: [14, 15]
  npuCount: 2
  rayResources:
    NPU: 2
    MINERU_NPU: 2
    mineru_npu: 2
  resources:
    requests:
      cpu: "64"
      memory: 256Gi
    limits:
      cpu: "64"
      memory: 256Gi
  sharedMemorySize: 128Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  service:
    enabled: true
    type: ClusterIP
  servers:
    - id: a
      physicalDevice: 14
      port: 30001
      cpuSet: 0-31
    - id: b
