    windowPrefetch: 1
    maxNumSeqs: 288
    maxNumBatchedTokens: 2560
    gpuMemoryUtilization: 0.50
    backend: hybrid-http-client
    effort: high
    imageAnalysis: true

qwen:
  enabled: true
  standaloneEnabled: true
  rayWorkerGroupsEnabled: true
  replicas: 0
  minReplicas: 0
  maxReplicas: 1
  image:
    repository: 110.120.0.3:8889/mineru/vllm-ascend-worker
    tag: v0.21.0rc1-a3-20260713-s3
    pullPolicy: IfNotPresent
  modelPath: /models/Qwen3.6-35B-A3B-w8a8
  modelName: qwen3.6-35b-a3b
  npuCount: 2
  physicalDevices: [14, 15]
  tensorParallelSize: 1
  dataParallelSize: 1
  endpoints:
    - id: qwen-a
      devices: "14"
      port: 8000
      cpuSet: 0-27
    - id: qwen-b
      devices: "15"
      port: 8001
      cpuSet: 28-55
