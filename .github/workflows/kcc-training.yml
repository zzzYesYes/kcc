name: kcc-training-stable

on:
  push:
    paths:
      - "pretrain-ray-main/**"
      - ".github/workflows/kcc-training.yml"
  pull_request:
    paths:
      - "pretrain-ray-main/**"
      - ".github/workflows/kcc-training.yml"
  workflow_dispatch:
    inputs:
      controller_base:
        description: Digest-pinned Python controller base image
        required: false
        type: string
      head_base:
        description: Digest-pinned Ray head base image
        required: false
        type: string
      worker_base:
        description: Digest-pinned Ascend worker base image
        required: false
        type: string
      kubectl_image:
        description: Digest-pinned kubectl image
        required: false
        type: string
      control_platform:
        description: Controller and head target platform
        required: false
        default: linux/amd64
        type: choice
        options: [linux/amd64, linux/arm64]
      worker_platform:
        description: Ascend worker target platform
        required: false
        default: linux/arm64
        type: choice
        options: [linux/amd64, linux/arm64]

defaults:
  run:
    working-directory: pretrain-ray-main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pretrain-ray-main/pyproject.toml
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Unit, contract, package and Helm audit
        run: make check
      - name: Offline bundle metadata smoke
        run: |
          scripts/build-stable-bundle.sh --metadata-only /tmp/kcc-stable-bundle 1.1.8 \
            registry.example/kcc-training-controller@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            registry.example/kcc-training-head@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            registry.example/kcc-training-worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          test -f /tmp/kcc-stable-bundle/SHA256SUMS
          test -f /tmp/kcc-stable-bundle/images.lock.json
          test -f /tmp/kcc-stable-bundle/values.yaml
          test -x /tmp/kcc-stable-bundle/scripts/install-stable.sh
          (cd /tmp/kcc-stable-bundle && sha256sum --check SHA256SUMS)
          test -x /tmp/kcc-stable-bundle/scripts/load-images.sh
          python -m venv /tmp/kcc-preflight-venv
          sed -i 's#https://artifact-gateway.invalid#https://artifact-gateway.kcc.svc#' \
            /tmp/kcc-stable-bundle/values.yaml
          PATH="/tmp/kcc-preflight-venv/bin:$PATH" \
            KCC_PREFLIGHT_RENDER_ONLY=true \
            /tmp/kcc-stable-bundle/scripts/stable-preflight.sh \
            /tmp/kcc-stable-bundle/values.yaml kcc-training kcc \
            /tmp/kcc-stable-bundle/examples/runtime-profile.yaml
          mkdir -p /tmp/kcc-offline-install
          python -m pip install --no-index \
            --find-links /tmp/kcc-stable-bundle/python \
            --target /tmp/kcc-offline-install \
            kcc-training==1.1.8
          PYTHONPATH=/tmp/kcc-offline-install python -S -m kcc_training --version

  image-build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.controller_base != '' &&
          inputs.head_base != '' &&
          inputs.worker_base != '' &&
          inputs.kubectl_image != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build platform images
        run: |
          scripts/build-images.sh local/kcc 1.1.8 \
            "${{ inputs.controller_base }}" \
            "${{ inputs.head_base }}" \
            "${{ inputs.worker_base }}" \
            "${{ inputs.kubectl_image }}" \
            "${{ inputs.control_platform }}" \
            "${{ inputs.worker_platform }}"

