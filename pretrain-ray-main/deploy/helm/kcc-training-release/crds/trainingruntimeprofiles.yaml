apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: trainingruntimeprofiles.training.kcc.io}
spec:
  group: training.kcc.io
  scope: Namespaced
  names: {plural: trainingruntimeprofiles, singular: trainingruntimeprofile, kind: TrainingRuntimeProfile, shortNames: [trp]}
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              additionalProperties: false
              required: [images, rayVersion, accelerator, workspace, scheduling, integrations]
              properties:
                images:
                  type: object
                  additionalProperties: false
                  required: [head, worker]
                  properties:
                    head: {type: string, pattern: '^\\S+@sha256:[0-9a-f]{64}$'}
                    worker: {type: string, pattern: '^\\S+@sha256:[0-9a-f]{64}$'}
                rayVersion: {type: string, minLength: 1}
                accelerator:
                  type: object
                  additionalProperties: false
                  required: [resourceName, devicesPerNode, runtimeClassName]
                  properties:
                    resourceName: {type: string, minLength: 1}
                    devicesPerNode: {type: integer, minimum: 1, maximum: 64}
                    runtimeClassName: {type: string, minLength: 1}
                workspace:
                  type: object
                  additionalProperties: false
                  required: [claimName, mountPath]
                  properties:
                    claimName: {type: string, minLength: 1}
                    mountPath: {type: string, pattern: '^/'}
                scheduling:
                  type: object
                  additionalProperties: false
                  required: [activeNodes, spareNodes, headSelector, workerSelector]
                  properties:
                    activeNodes: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
                    spareNodes: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
                    headSelector: {type: object, additionalProperties: {type: string}}
                    workerSelector: {type: object, additionalProperties: {type: string}}
                integrations:
                  type: object
                  additionalProperties: false
                  required: [rankTableProvider, healthProvider]
                  properties:
                    rankTableProvider: {type: string, enum: [clusterd, native, static]}
                    healthProvider: {type: string, enum: [npu-exporter]}
