apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ include "kcc.fullname" . }} }
rules:
  - apiGroups: ["training.kcc.io"]
    resources: ["trainingruns", "trainingrecipes", "trainingruntimeprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["training.kcc.io"]
    resources: ["trainingruns/status"]
    verbs: ["get", "update"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ include "kcc.fullname" . }} }
subjects:
  - {kind: ServiceAccount, name: {{ include "kcc.fullname" . }}, namespace: {{ .Release.Namespace }} }
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "kcc.fullname" . }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ include "kcc.fullname" . }}, namespace: {{ .Release.Namespace }} }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ include "kcc.fullname" . }}, namespace: {{ .Release.Namespace }} }
subjects:
  - {kind: ServiceAccount, name: {{ include "kcc.fullname" . }}, namespace: {{ .Release.Namespace }} }
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "kcc.fullname" . }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ include "kcc.fullname" . }}-runtime, namespace: {{ .Release.Namespace }} }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ include "kcc.fullname" . }}-runtime, namespace: {{ .Release.Namespace }} }
subjects:
  - {kind: ServiceAccount, name: {{ .Values.runtimeServiceAccount }}, namespace: {{ .Release.Namespace }} }
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "kcc.fullname" . }}-runtime}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ include "kcc.fullname" . }}-exporter, namespace: {{ .Values.npuExporter.namespace }} }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ include "kcc.fullname" . }}-exporter, namespace: {{ .Values.npuExporter.namespace }} }
subjects:
  - {kind: ServiceAccount, name: {{ include "kcc.fullname" . }}, namespace: {{ .Release.Namespace }} }
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "kcc.fullname" . }}-exporter}
