apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kcc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kcc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kcc.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "kcc.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kcc.fullname" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ .Values.controller.image }}
          imagePullPolicy: {{ .Values.controller.imagePullPolicy }}
          args:
            - python
            - -m
            - kcc_training.controller_entrypoint
            - --namespace
            - $(POD_NAMESPACE)
            - --runtime-service-account
            - {{ .Values.runtimeServiceAccount }}
            - --poll-seconds
            - {{ .Values.controller.pollSeconds | quote }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports: [{name: health, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /healthz, port: health}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 2, periodSeconds: 5}
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      terminationGracePeriodSeconds: 30

