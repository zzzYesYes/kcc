apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trainingrecipes.training.kcc.io
spec:
  group: training.kcc.io
  scope: Namespaced
  names: {plural: trainingrecipes, singular: trainingrecipe, kind: TrainingRecipe, shortNames: [trecipe]}
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              additionalProperties: false
              required: [framework, command, workingDirectory, environment, artifacts]
              properties:
                framework: {type: string, minLength: 1}
                command:
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1}
                workingDirectory: {type: string, pattern: '^/'}
                environment:
                  type: object
                  additionalProperties: {type: string}
                artifacts:
                  type: object
                  additionalProperties: false
                  required: [source, model, data, outputSubpath]
                  properties:
                    source: {type: string, minLength: 1}
                    model: {type: string, minLength: 1}
                    data: {type: string, minLength: 1}
                    outputSubpath: {type: string, pattern: '^[^/]'}

